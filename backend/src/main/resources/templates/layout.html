<!DOCTYPE html>
<!--
  Shared markup for the two public pages. Thymeleaf without the layout dialect means fragments, not decoration, so
  each page keeps its own <body> and pulls the <head> and the nav from here. The head carries the rel=alternate block
  that makes the whole site discoverable (FR-1.3), which is the one part of these pages a crawler actually parses.
-->
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head th:fragment="head(pageTitle, feeds)">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${pageTitle}">Notes</title>
  <link rel="alternate" th:each="feed : ${feeds}"
        th:href="${feed.href}" th:type="${feed.type}" th:title="${feed.title}">
  <style>
    :root { --fg: #1c1c1c; --quiet: #6b6b6b; --line: #e6e3dd; --bg: #fbfaf7; --accent: #2f5d8a; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--fg);
           font: 16px/1.7 "Charter", "Source Han Serif SC", Georgia, serif; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .wrap { max-width: 46rem; margin: 0 auto; padding: 2rem 1.25rem 4rem; }
    nav.site { display: flex; gap: 1.25rem; align-items: baseline; border-bottom: 1px solid var(--line);
               padding-bottom: .75rem; margin-bottom: 2rem; font: 600 14px/1.4 system-ui, sans-serif; }
    nav.site .brand { font-size: 16px; color: var(--fg); }
    nav.site .subscribe { margin-left: auto; color: var(--quiet); font-weight: 400; }
    nav.site .subscribe a { color: var(--quiet); }
    .meta { color: var(--quiet); font: 13px/1.6 system-ui, sans-serif; }
    .chips { display: flex; flex-wrap: wrap; gap: .4rem; margin-top: .6rem; }
    .chip { font: 12px/1 system-ui, sans-serif; border: 1px solid var(--line); border-radius: 999px;
            padding: .25rem .6rem; color: var(--quiet); background: #fff; }
    h1 { font-size: 1.9rem; line-height: 1.25; margin: 0 0 .4rem; }
    article h2 { margin-top: 2rem; }
    article pre, article code { font-family: "JetBrains Mono", Consolas, monospace; font-size: 14px; }
    article pre { background: #fff; border: 1px solid var(--line); border-radius: 6px; padding: .9rem;
                  overflow-x: auto; }
    article img { max-width: 100%; height: auto; }
    article blockquote { margin: 1rem 0; padding-left: 1rem; border-left: 3px solid var(--line); color: var(--quiet); }
    article table { border-collapse: collapse; width: 100%; font-size: 15px; }
    article th, article td { border: 1px solid var(--line); padding: .4rem .6rem; text-align: left; }
    li.post { list-style: none; margin-bottom: 1.9rem; }
    ul.posts { padding: 0; margin: 0; }
    ul.posts h2 { font-size: 1.3rem; margin: 0 0 .2rem; }
    footer { margin-top: 3rem; padding-top: 1rem; border-top: 1px solid var(--line);
             font: 13px/1.6 system-ui, sans-serif; color: var(--quiet); }
  </style>
</head>
<body>
<nav class="site" th:fragment="nav(site)">
  <a class="brand" th:href="${site.absolute('/blog')}" th:text="${site.siteTitle}">Notes</a>
  <a th:href="${site.absolute('/blog')}">文章</a>
  <span class="subscribe">
    订阅：<a th:href="${site.absolute('/feed.rss')}">RSS</a> ·
    <a th:href="${site.absolute('/feed.atom')}">Atom</a> ·
    <a th:href="${site.absolute('/feed.json')}" title="application/feed+json 未在 IANA 注册，按事实标准输出">JSON</a>
  </span>
</nav>
</body>
</html>
